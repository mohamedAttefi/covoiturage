<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700">
<style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:22px;font-weight:bold}.head{font-size:17px;font-weight:bold;fill:#fff}.attr{font-size:14px}.box{fill:#fff;stroke:#355070;stroke-width:2}.bar{fill:#355070}.line{stroke:#53677f;stroke-width:2;fill:none}.multi{font-size:14px;fill:#53677f}</style>
